<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .feature-toggle {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .voice-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.3);
            transition: 0.4s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #4CAF50;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.ai .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
        }

        .message.ai.with-search .message-content {
            border-left: 4px solid #4CAF50;
        }

        .sources {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        .sources a {
            color: #667eea;
            text-decoration: none;
        }

        .sources a:hover {
            text-decoration: underline;
        }

        .typing {
            display: flex;
            gap: 5px;
            padding: 12px 16px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: scale(1);
        }

        .mic-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        .mic-button:hover {
            transform: scale(1.1);
        }

        .mic-button.listening {
            background: #f44336 !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(244, 67, 54, 0); }
        }

        .speaker-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .speaker-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .speaker-button.speaking {
            background: #4CAF50;
            animation: pulse 1s infinite;
        }

        .welcome {
            text-align: center;
            color: #666;
            padding: 40px;
        }

        .welcome h2 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #4CAF50;
            color: white;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Live AI Assistant</h1>
            <p>Powered by Google Gemini 2.5 Flash <span class="status-badge">FREE</span></p>
            
            <div class="feature-toggle">
                <div class="voice-controls">
                    <span>💬 Chat Only</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="searchToggle" checked>
                        <span class="slider"></span>
                    </label>
                    <span>🔍 With Web Search</span>
                </div>
                
                <div class="voice-controls">
                    <span>🔊 Voice:</span>
                    <button class="speaker-button" id="voiceToggle" title="Toggle auto-speak responses">
                        🔇
                    </button>
                </div>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome">
                <h2>Welcome! 👋</h2>
                <p>Ask me anything! Toggle web search to get current information.</p>
                <p style="margin-top: 10px; font-size: 12px;">
                    Try: "What's the weather today?" or "Latest news about AI"
                </p>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <button class="mic-button" id="micButton" onclick="toggleVoiceInput()" title="Click to speak">
                    🎤
                </button>
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type or click the mic to speak..."
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                >
                <button onclick="sendMessage()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const searchToggle = document.getElementById('searchToggle');
        const micButton = document.getElementById('micButton');
        const voiceToggle = document.getElementById('voiceToggle');

        // Generate a unique session ID for this browser
        let sessionId = localStorage.getItem('sessionId');
        if (!sessionId) {
            sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('sessionId', sessionId);
        }
        console.log('Session ID:', sessionId);

        // Voice settings
        let autoSpeak = false;
        let isListening = false;
        let recognition = null;

        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = function() {
                isListening = true;
                micButton.classList.add('listening');
                console.log('🎤 Listening...');
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                messageInput.value = transcript;
                console.log('📝 You said:', transcript);
            };

            recognition.onend = function() {
                isListening = false;
                micButton.classList.remove('listening');
                console.log('🎤 Stopped listening');
            };

            recognition.onerror = function(event) {
                console.error('❌ Speech recognition error:', event.error);
                isListening = false;
                micButton.classList.remove('listening');
                alert('Voice input error: ' + event.error);
            };
        } else {
            console.warn('⚠️ Speech recognition not supported');
            micButton.style.display = 'none';
        }

        // Toggle voice input
        function toggleVoiceInput() {
            if (!recognition) {
                alert('Speech recognition not supported in your browser');
                return;
            }

            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        // Toggle auto-speak
        voiceToggle.onclick = function() {
            autoSpeak = !autoSpeak;
            voiceToggle.textContent = autoSpeak ? '🔊' : '🔇';
            voiceToggle.style.background = autoSpeak ? '#4CAF50' : 'rgba(255, 255, 255, 0.2)';
            console.log('🔊 Auto-speak:', autoSpeak ? 'ON' : 'OFF');
        };

        // Text-to-Speech function
        function speakText(text) {
            if ('speechSynthesis' in window) {
                // Stop any ongoing speech
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                utterance.lang = 'en-US';

                utterance.onstart = function() {
                    voiceToggle.classList.add('speaking');
                };

                utterance.onend = function() {
                    voiceToggle.classList.remove('speaking');
                };

                window.speechSynthesis.speak(utterance);
                console.log('🔊 Speaking response');
            } else {
                console.warn('⚠️ Text-to-speech not supported');
            }
        }

        // Function to add message to chat
        function addMessage(text, isUser, sources = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            
            if (!isUser && sources && sources.length > 0) {
                messageDiv.classList.add('with-search');
            }

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = text.replace(/\n/g, '<br>');

            // Add sources if available
            if (sources && sources.length > 0) {
                const sourcesDiv = document.createElement('div');
                sourcesDiv.className = 'sources';
                sourcesDiv.innerHTML = '📚 Sources: ' + sources.map((url, idx) => 
                    `<a href="${url}" target="_blank">[${idx + 1}]</a>`
                ).join(' ');
                contentDiv.appendChild(sourcesDiv);
            }

            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Function to show typing indicator
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typing';
            typingDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Function to remove typing indicator
        function removeTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        // Function to send message
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, true);
            messageInput.value = '';
            sendBtn.disabled = true;

            // Show typing
            showTyping();

            // Determine endpoint based on toggle
            const useSearch = searchToggle.checked;
            const endpoint = useSearch ? '/search' : '/chat';

            try {
                const response = await fetch(`http://localhost:5000${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        message: message,
                        session_id: sessionId 
                    })
                });

                const data = await response.json();

                removeTyping();

                if (data.success) {
                    addMessage(
                        data.response, 
                        false, 
                        data.sources || null
                    );
                    
                    // Auto-speak if enabled
                    if (autoSpeak) {
                        speakText(data.response);
                    }
                } else {
                    addMessage(`Error: ${data.error}`, false);
                }
            } catch (error) {
                removeTyping();
                addMessage(`Error: ${error.message}. Make sure the server is running!`, false);
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        // Auto-focus on input
        messageInput.focus();
    </script>
</body>
</html>
